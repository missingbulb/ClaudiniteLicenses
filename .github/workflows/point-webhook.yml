name: point-webhook

on:
  workflow_dispatch:
    inputs:
      url:
        description: The address the Claudinite App's webhook should deliver to
        required: true
        default: https://license.claudinite.com/github-webhook

permissions:
  contents: read

jobs:
  point:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Point the App's webhook
        env:
          CLAUDINITE_GITHUB_APP_ID: ${{ secrets.CLAUDINITE_GITHUB_APP_ID }}
          CLAUDINITE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLAUDINITE_GITHUB_APP_PRIVATE_KEY }}
          WEBHOOK_URL: ${{ inputs.url }}
        run: node tools/point-app-webhook.mjs --url "$WEBHOOK_URL" --base "$GITHUB_API_URL"
