name: d1-restore

# Returns claudinite-licenses to a Time Travel bookmark, such as the one each deploy's summary
# prints from before its migrations. In place and destructive: queries in flight are cancelled and
# every row written after the bookmark is gone. A person's dispatch, never automatic.
on:
  workflow_dispatch:
    inputs:
      bookmark:
        description: The D1 Time Travel bookmark to restore claudinite-licenses to
        type: string
        required: true

permissions:
  contents: read

# The deploy's group, so a restore never races a migration.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore claudinite-licenses to the bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOKMARK: ${{ inputs.bookmark }}
        run: |
          npx wrangler d1 time-travel restore claudinite-licenses --bookmark="$BOOKMARK" --json -c db/wrangler.jsonc
      - name: Read the sync Worker back
        if: always()
        run: |
          {
            echo "## After restoring claudinite-licenses"
            for url in https://license.claudinite.com/v1/sync/health https://license.claudinite.com/v1/sync/alerts; do
              status=$(curl -sS -o "$RUNNER_TEMP/answer.json" -w '%{http_code}' --max-time 20 "$url" || true)
              echo
              echo "\`GET $url\` answered $status:"
              echo
              echo '```json'
              cat "$RUNNER_TEMP/answer.json"
              echo
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
