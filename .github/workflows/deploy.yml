name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GITHUB_APP_WEBHOOK_SECRET }}
      ISSUING_KEY_PRIVATE: ${{ secrets.ISSUING_KEY_PRIVATE }}
      ISSUING_KEY_CERT: ${{ secrets.ISSUING_KEY_CERT }}
    steps:
      - id: gate
        name: Check deploy secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_APP_WEBHOOK_SECRET ISSUING_KEY_PRIVATE ISSUING_KEY_CERT; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "deploy skipped: missing$missing (see #1, #2, ClaudiniteEngine#5)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # Expected while those issues are open: a skipped deploy is not a failure.
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip == 'false'
        run: npm ci
      - if: steps.gate.outputs.skip == 'false'
        name: Secrets for claudinite-public-key
        run: |
          node -e 'const e=process.env;console.log(JSON.stringify({GITHUB_APP_ID:e.GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY:e.GITHUB_APP_PRIVATE_KEY,ISSUING_KEY_PRIVATE:e.ISSUING_KEY_PRIVATE,ISSUING_KEY_CERT:e.ISSUING_KEY_CERT}))' > "$RUNNER_TEMP/public-key.secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/public-key.secrets.json" -c workers/public-key/wrangler.jsonc
          rm "$RUNNER_TEMP/public-key.secrets.json"
      - if: steps.gate.outputs.skip == 'false'
        name: Deploy claudinite-public-key
        run: npx wrangler deploy -c workers/public-key/wrangler.jsonc
      - if: steps.gate.outputs.skip == 'false'
        name: Secrets for claudinite-router
        run: |
          node -e 'console.log(JSON.stringify({GITHUB_APP_WEBHOOK_SECRET:process.env.GITHUB_APP_WEBHOOK_SECRET}))' > "$RUNNER_TEMP/router.secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/router.secrets.json" -c workers/router/wrangler.jsonc
          rm "$RUNNER_TEMP/router.secrets.json"
      - if: steps.gate.outputs.skip == 'false'
        name: Deploy claudinite-router
        run: npx wrangler deploy -c workers/router/wrangler.jsonc
