name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rotate_polar_webhook:
        description: Replace the Polar webhook endpoint, and with it the sync Worker's POLAR_WEBHOOK_SECRET
        type: boolean
        default: false
      rehearse_d1_restore:
        description: Rehearse the D1 Time Travel restore on a throwaway database the run creates and deletes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # id-token: the read-back asks GitHub for an OIDC token, so a real one proves the key Worker's verifier.
    permissions:
      contents: read
      id-token: write
    env:
      WRANGLER_SEND_METRICS: "false"
      # Each version's message, so `wrangler versions list` reads as a changelog of runs.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: gate
        name: Check deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAUDINITE_GITHUB_APP_ID: ${{ secrets.CLAUDINITE_GITHUB_APP_ID }}
          CLAUDINITE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLAUDINITE_GITHUB_APP_PRIVATE_KEY }}
          CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET }}
          KEY_ISSUING_KEY_PRIVATE: ${{ secrets.KEY_ISSUING_KEY_PRIVATE }}
          KEY_ISSUING_KEY_CERT: ${{ secrets.KEY_ISSUING_KEY_CERT }}
          POLAR_SANDBOX_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLAUDINITE_GITHUB_APP_ID CLAUDINITE_GITHUB_APP_PRIVATE_KEY CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET KEY_ISSUING_KEY_PRIVATE KEY_ISSUING_KEY_CERT POLAR_SANDBOX_TOKEN; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "deploy skipped: missing$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # Expected until every secret is set: a skipped deploy is not a failure.
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip == 'false'
        run: npm ci
      - if: steps.gate.outputs.skip == 'false'
        id: live
        name: Read the live versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The version each Worker serves now is what a failure rolls it back to. A split an
          # interrupted run left behind is rolled back by hand first; this run never stacks on one,
          # and stops here, before it records a restore point or applies a migration.
          for w in key sync; do
            node tools/stage.mjs status --config "workers/$w/wrangler.jsonc" --json "$RUNNER_TEMP/$w.status.json"
            live=$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).versions;if(v.length>1){console.error(v.map((x)=>x.id+"@"+x.percentage+"%").join(" "));process.exit(1)}process.stdout.write(v[0]?.id??"")' "$RUNNER_TEMP/$w.status.json") || {
              echo "::error::claudinite-$w has a split standing; roll it back by hand with node tools/stage.mjs rollback --config workers/$w/wrangler.jsonc --id <the version that should be live>, then rerun"
              exit 1
            }
            echo "claudinite-$w live: ${live:-none}"
            echo "${w//-/_}=$live" >> "$GITHUB_OUTPUT"
          done
      - if: steps.gate.outputs.skip == 'false'
        name: Make the D1 database exist and write its id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ensure-d1.mjs --name claudinite-licenses --write
      - if: steps.gate.outputs.skip == 'false'
        name: Record the D1 restore point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 time-travel info claudinite-licenses --json -c db/wrangler.jsonc > "$RUNNER_TEMP/restore-point.json"
          bookmark=$(node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8");const b=JSON.parse(t.slice(t.indexOf("{"))).bookmark;if(typeof b!=="string"||!b)process.exit(1);process.stdout.write(b)' "$RUNNER_TEMP/restore-point.json")
          echo "D1 restore point before this run's migrations: $bookmark"
          {
            echo "## D1 restore point"
            echo
            echo "claudinite-licenses before this run's migrations is bookmark \`$bookmark\`. To return the database there, dispatch \`d1-restore\` with that bookmark: \`gh workflow run d1-restore.yml -f bookmark=$bookmark\`. The bookmark stays valid for 7 days on Workers Free, 30 on Workers Paid."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.skip == 'false'
        name: Apply the D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply claudinite-licenses --remote -c db/wrangler.jsonc
      - if: steps.gate.outputs.skip == 'false'
        name: Make the writes queue and its dead-letter queue exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ensure-queue.mjs --name claudinite-licenses-writes --dlq
      - if: steps.gate.outputs.skip == 'false' && inputs.rehearse_d1_restore
        name: Rehearse the D1 restore on a throwaway database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/d1-restore-rehearsal.mjs
      - if: steps.gate.outputs.skip == 'false'
        name: Turn on D1 read replication when D1_READ_REPLICATION says so
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Unset or off, the deploy only reads the mode. auto is set once a dispatch with
          # rehearse_d1_restore has proven Time Travel's restore on a replicated database; from then
          # on every deploy turns the mode back to auto if it was flipped off elsewhere.
          D1_READ_REPLICATION: ${{ vars.D1_READ_REPLICATION }}
        run: |
          case "$D1_READ_REPLICATION" in
            ""|off) out=$(node tools/ensure-d1.mjs --name claudinite-licenses --show-read-replication)
                note="D1_READ_REPLICATION is ${D1_READ_REPLICATION:-unset}, so the deploy changes nothing" ;;
            auto) out=$(node tools/ensure-d1.mjs --name claudinite-licenses --read-replication auto) ;;
            *) echo "::error::the repository variable D1_READ_REPLICATION is $D1_READ_REPLICATION; set it to auto or off, or unset it"
               exit 1 ;;
          esac
          echo "$out"
          mode=$(printf '%s\n' "$out" | sed -n 's/^read replication: //p')
          # The API reference makes read_replication optional, so an unknown mode only warns until
          # the deploy is asked to own it.
          warning=""
          if [ "$D1_READ_REPLICATION" = auto ]; then
            case "$mode" in
              "auto (changed)"|"auto (unchanged)") ;;
              *) echo "::error::claudinite-licenses reports ${mode:-no read replication mode} after asking for auto"
                 exit 1 ;;
            esac
          else
            case "$mode" in
              auto|disabled) ;;
              *) warning="claudinite-licenses reports no read replication mode the deploy knows: ${mode:-nothing}; D1_READ_REPLICATION is ${D1_READ_REPLICATION:-unset}, continuing"
                 echo "::warning::$warning" ;;
            esac
          fi
          {
            echo "## D1 read replication"
            echo
            echo "${note:-D1_READ_REPLICATION is auto}: read replication: $mode"
            [ -z "$warning" ] || { echo; echo "Warning: $warning"; }
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.skip == 'false'
        id: upload-key
        name: Upload claudinite-key with its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ISSUING_KEY_PRIVATE: ${{ secrets.KEY_ISSUING_KEY_PRIVATE }}
          ISSUING_KEY_CERT: ${{ secrets.KEY_ISSUING_KEY_CERT }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
        run: |
          # The secrets travel with the version, so none reaches the live code before its own does.
          trap 'rm -f "$RUNNER_TEMP/key.secrets.json"' EXIT
          umask 077
          node -e 'const e=process.env;console.log(JSON.stringify({ISSUING_KEY_PRIVATE:e.ISSUING_KEY_PRIVATE,ISSUING_KEY_CERT:e.ISSUING_KEY_CERT,POLAR_ACCESS_TOKEN:e.POLAR_ACCESS_TOKEN}))' > "$RUNNER_TEMP/key.secrets.json"
          node tools/stage.mjs upload --config workers/key/wrangler.jsonc --secrets-file "$RUNNER_TEMP/key.secrets.json" --tag "${GITHUB_SHA::7}" --message "$RUN_URL" --json "$RUNNER_TEMP/key.upload.json"
          echo "version_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version_id' "$RUNNER_TEMP/key.upload.json")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        name: Make the Polar webhook endpoint exist
        env:
          POLAR_API_BASE: https://sandbox-api.polar.sh
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
          ROTATE: ${{ inputs.rotate_polar_webhook }}
        run: |
          # Polar shows an endpoint's secret only when it makes the endpoint, so a Worker that lost or
          # never had the secret needs a new endpoint; otherwise the existing one is kept.
          rotate=""
          if [ "$ROTATE" = "true" ]; then
            rotate="--rotate"
          elif ! curl -sS --max-time 20 https://license.claudinite.com/v1/sync/health | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{let b={};try{b=JSON.parse(s)}catch{}process.exit(b.polar_webhook_secret===true?0:1)})'; then
            rotate="--rotate"
          fi
          node tools/ensure-polar-webhook.mjs --url https://license.claudinite.com/v1/sync/polar-webhook --secret-out "$RUNNER_TEMP/polar-webhook-secret" $rotate
      - if: steps.gate.outputs.skip == 'false'
        name: Delete the retired router and public-key Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The sync Worker now holds license.claudinite.com/github-webhook, a route Cloudflare refuses
        # to give a second Worker while the router holds it. A Worker already gone counts as done.
        run: node tools/retire-workers.mjs --name claudinite-router --name claudinite-public-key
      - if: steps.gate.outputs.skip == 'false'
        id: deploy-sync
        name: Deploy claudinite-sync with its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ secrets.CLAUDINITE_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLAUDINITE_GITHUB_APP_PRIVATE_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET }}
          LIVE: ${{ steps.live.outputs.sync }}
        run: |
          # The sync Worker deploys at once: which version a split hands its cron and queue consumer
          # is not documented, and it never touches key issuance. `wrangler deploy` applies its crons
          # and queue consumers, which a version upload does not. A failure here or in its judge rolls
          # it back to LIVE.
          mkdir -p "$RUNNER_TEMP/staged"
          printf %s "$LIVE" > "$RUNNER_TEMP/staged/sync"
          # The secrets travel with the version, so the version a rollback returns to holds the secrets
          # it ran with; a secret left out of the file is kept from the previous version.
          trap 'rm -f "$RUNNER_TEMP/sync.secrets.json" "$RUNNER_TEMP/polar-webhook-secret"' EXIT
          umask 077
          # The webhook secret exists only when the step before made a new endpoint.
          node -e 'const e=process.env,fs=require("fs"),f=e.RUNNER_TEMP+"/polar-webhook-secret",hook=fs.existsSync(f)?{POLAR_WEBHOOK_SECRET:fs.readFileSync(f,"utf8")}:{};console.log(JSON.stringify({GITHUB_APP_ID:e.GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY:e.GITHUB_APP_PRIVATE_KEY,GITHUB_APP_WEBHOOK_SECRET:e.GITHUB_APP_WEBHOOK_SECRET,POLAR_ACCESS_TOKEN:e.POLAR_ACCESS_TOKEN,...hook}))' > "$RUNNER_TEMP/sync.secrets.json"
          npx wrangler deploy -c workers/sync/wrangler.jsonc --secrets-file "$RUNNER_TEMP/sync.secrets.json"
          # The version the judge requires the queue consumer to have run on.
          node tools/stage.mjs status --config workers/sync/wrangler.jsonc --json "$RUNNER_TEMP/sync.status.json" > /dev/null
          deployed=$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).versions;if(v.length!==1){console.error(v.map((x)=>x.id+"@"+x.percentage+"%").join(" "));process.exit(1)}process.stdout.write(v[0].id)' "$RUNNER_TEMP/sync.status.json") || {
            echo "::error::claudinite-sync is not on one version after wrangler deploy"
            exit 1
          }
          echo "claudinite-sync deployed: $deployed"
          echo "version_id=$deployed" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        name: Judge claudinite-sync by its own health and alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_VERSION: ${{ steps.deploy-sync.outputs.version_id }}
        run: |
          # ip_limit is what the per-address cap made of that read: `counted` proves the binding is live
          # and called. A limiter that threw once is asked again like a status that was not yet 200.
          for i in 1 2 3 4 5 6; do
            status=$(curl -sS -o "$RUNNER_TEMP/sync-health.json" -w '%{http_code}' --max-time 20 https://license.claudinite.com/v1/sync/health || true)
            ip_limit=$(node -e 'let b={};try{b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))}catch{}process.stdout.write(String(b.ip_limit))' "$RUNNER_TEMP/sync-health.json")
            [ "$status" = 200 ] && [ "$ip_limit" = counted ] && break
            sleep $((i * 5))
          done
          if [ "$status" != 200 ]; then
            echo "::error::claudinite-sync answered $status on /v1/sync/health after its deploy: $(head -c 300 "$RUNNER_TEMP/sync-health.json")"
            exit 1
          fi
          if [ "$ip_limit" != counted ]; then
            echo "::error::claudinite-sync's health reports ip_limit $ip_limit after its deploy; the per-address cap is not wired"
            exit 1
          fi
          # The write path, proven from outside: after one message is pushed onto the writes queue, the
          # consumer's stamps must show a batch landed on the deployed version. That covers the queue
          # bound to the deployed version, the consumer running on it, one D1 write through it, and the
          # stamps. The lag bound is the queue-lagging alert's, so a draining backlog is not a rollback.
          started=$(date +%s)
          push() {
            pushed=$(date +%s)
            node tools/push-queue-message.mjs --queue claudinite-licenses-writes --marker deploy-read-back --detail "$RUN_URL" || {
              echo "::error::could not push the deploy-read-back message onto claudinite-licenses-writes, so the queue consumer is unproven; the CLOUDFLARE_API_TOKEN needs the Queues Edit (or Workers Scripts Edit) permission and the queue must exist"
              exit 1
            }
          }
          push
          pushes=1
          # The consumer waits up to its max_batch_timeout, 5 seconds, before it runs. For a while after
          # wrangler deploy the previous version can still be the one consuming: a batch that landed
          # after the last push on another version (exit 2) is answered with one more push.
          stamps=""
          for i in 1 2 3 4 5 6 7 8; do
            sleep $((i * 3))
            status=$(curl -sS -o "$RUNNER_TEMP/sync-health.json" -w '%{http_code}' --max-time 20 https://license.claudinite.com/v1/sync/health || true)
            if stamps=$(node -e 'let b={};try{b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))}catch{}const[,,started,pushed,want]=process.argv.map(String);process.stdout.write(`last_queue_at ${b.last_queue_at} last_queue_version ${b.last_queue_version} queue_lag_s ${b.queue_lag_s}`);const at=typeof b.last_queue_at==="number"?b.last_queue_at:-1;process.exitCode=(at>=Number(started)&&b.last_queue_version===want&&typeof b.queue_lag_s==="number"&&b.queue_lag_s<=900)?0:(at>=Number(pushed)&&b.last_queue_version!==want)?2:1' "$RUNNER_TEMP/sync-health.json" "$started" "$pushed" "$SYNC_VERSION"); then
              echo "ok a writes-queue batch landed on the deployed version after the push: $stamps"
              break
            else
              verdict=$?
            fi
            if [ "$verdict" = 2 ] && [ "$pushes" -lt 4 ]; then
              echo "a batch landed after the push on another version ($stamps); pushing again"
              push
              pushes=$((pushes + 1))
              continue
            fi
            if [ "$verdict" = 2 ] && [ "$pushes" -ge 4 ]; then
              echo "::error::claudinite-sync's queue consumer answered all $pushes deploy-read-back pushes on another version (status $status, $stamps), not $SYNC_VERSION"
              exit 1
            fi
            if [ "$i" = 8 ]; then
              echo "::error::claudinite-sync's queue consumer did not stamp the deploy's message on $SYNC_VERSION since $started: status $status, $stamps"
              exit 1
            fi
          done
          status=$(curl -sS -o "$RUNNER_TEMP/sync-alerts.json" -w '%{http_code}' --max-time 20 https://license.claudinite.com/v1/sync/alerts || true)
          B="$(cat "$RUNNER_TEMP/sync-alerts.json")" S="$status" node -e '
            let b = null;
            try { b = JSON.parse(process.env.B); } catch {}
            if (!(process.env.S === "200" || process.env.S === "503") || !b || !Array.isArray(b.alerts)) {
              console.log(`::error::claudinite-sync answered ${process.env.S} on /v1/sync/alerts without the alerts shape after its deploy`);
              process.exit(1);
            }
          '
          # Judged healthy on its own: the two halves are independent, so a failure from here on is no
          # verdict on the sync Worker and does not roll it back.
          rm -f "$RUNNER_TEMP/staged/sync"
          : > "$RUNNER_TEMP/sync-judged"
      - if: steps.gate.outputs.skip == 'false'
        id: split
        name: Serve the new version to one tenth of requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY_NEW: ${{ steps.upload-key.outputs.version_id }}
          KEY_LIVE: ${{ steps.live.outputs.key }}
        run: |
          mkdir -p "$RUNNER_TEMP/staged"
          for w in key; do
            var=$(echo "$w" | tr a-z- A-Z_)
            new=$(printenv "${var}_NEW")
            # Written before the split, so a split that throws midway is still rolled back.
            live=$(printenv "${var}_LIVE" || true)
            printf %s "$live" > "$RUNNER_TEMP/staged/$w"
            node tools/stage.mjs split --config "workers/$w/wrangler.jsonc" --new "$new" --percent 10 --json "$RUNNER_TEMP/$w.split.json"
            echo "${w//-/_}_previous=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).previous ?? ""' "$RUNNER_TEMP/$w.split.json")" >> "$GITHUB_OUTPUT"
          done
      - if: steps.gate.outputs.skip == 'false'
        name: Make the route hostname resolve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/ensure-dns.mjs --zone claudinite.com --name license.claudinite.com
      - if: steps.gate.outputs.skip == 'false'
        id: canary
        name: Probe the new version from outside
        env:
          KEY_NEW: ${{ steps.upload-key.outputs.version_id }}
        run: |
          # Every check answered by a split Worker is judged on its new version's answer; the alerts
          # check is reported by the read-back, never gated on here.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claudinite" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$OIDC"
          export OIDC
          set +e
          node tools/probe.mjs --base https://license.claudinite.com --oidc-token-env OIDC --expect-version "key=$KEY_NEW" --json "$RUNNER_TEMP/canary.json" --attempts 2
          set -e
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/canary.json", "utf8"));
            const failed = s.checks.filter((c) => !c.ok && c.name !== "sync-alerts");
            for (const c of failed) console.log(`::error::canary check ${c.name} failed on version ${c.version ?? "unknown"}: ${c.detail}`);
            process.exit(failed.length ? 1 : 0);
          '
      - if: steps.gate.outputs.skip == 'false' && steps.canary.outcome == 'success'
        name: Promote the new version to all requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY_NEW: ${{ steps.upload-key.outputs.version_id }}
        run: |
          for w in key; do
            var=$(echo "$w" | tr a-z- A-Z_)
            node tools/stage.mjs promote --config "workers/$w/wrangler.jsonc" --id "$(printenv "${var}_NEW")"
          done
          # A version upload applies bindings and vars but not routes or crons; this applies them.
          for w in key sync; do
            node tools/stage.mjs triggers --config "workers/$w/wrangler.jsonc"
          done
      - if: steps.gate.outputs.skip == 'false'
        name: Request both reconciles through the writes queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_VERSION: ${{ steps.deploy-sync.outputs.version_id }}
        run: |
          # Each reconcile is requested as the judge proved the queue: a marker pushed onto the writes
          # queue, which the consumer answers by running that reconcile, proven by its stamp reaching
          # the push. The App is installed on all of missingbulb, so the GitHub one must find repos. A
          # version that does not know the marker acks it unrun, so a batch that landed after the
          # push on another version (exit 2) is answered with one more push.
          request() {
            marker=$1
            field=$2
            pushes=0
            while :; do
              pushed=$(date +%s)
              node tools/push-queue-message.mjs --queue claudinite-licenses-writes --marker "$marker" --detail "$RUN_URL" > /dev/null || {
                echo "::error::could not push $marker onto claudinite-licenses-writes, so the reconcile was never requested; the CLOUDFLARE_API_TOKEN needs the Queues Edit (or Workers Scripts Edit) permission"
                return 1
              }
              pushes=$((pushes + 1))
              code=1
              for i in 1 2 3 4 5 6 7 8; do
                sleep $((i * 3))
                curl -sS -o "$RUNNER_TEMP/sync-health.json" --max-time 20 https://license.claudinite.com/v1/sync/health > /dev/null || true
                if seen=$(node -e 'let b={};try{b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))}catch{}const[,,field,pushed,want]=process.argv;const github=field==="last_reconcile_at";process.stdout.write(`${field} ${b[field]} ${github?`repos ${b.repos}`:`last_polar_reconcile_error ${b.last_polar_reconcile_error}`} last_queue_at ${b.last_queue_at} last_queue_version ${b.last_queue_version}`);const at=typeof b[field]==="number"?b[field]:-1,q=typeof b.last_queue_at==="number"?b.last_queue_at:-1;process.exitCode=(at>=Number(pushed)&&(!github||b.repos>0))?0:(q>=Number(pushed)&&b.last_queue_version!==want)?2:1' "$RUNNER_TEMP/sync-health.json" "$field" "$pushed" "$SYNC_VERSION"); then
                  echo "ok $marker ran after the push: $seen"
                  return 0
                else
                  code=$?
                fi
                [ "$code" = 2 ] && break
              done
              if [ "$code" != 2 ]; then
                echo "::error::$marker was pushed at $pushed and its reconcile never answered it: $seen"
                return 1
              fi
              if [ "$pushes" -ge 4 ]; then
                echo "::error::$marker was pushed $pushes times and only another version consumed it, not $SYNC_VERSION: $seen"
                return 1
              fi
              echo "a batch landed on another version after the push of $marker ($seen); pushing again"
            done
          }
          request reconcile-now last_reconcile_at
          request polar-reconcile-now last_polar_reconcile_at
      - if: steps.gate.outputs.skip == 'false'
        id: read-back
        name: Read back the live Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POLAR_API_BASE: https://sandbox-api.polar.sh
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          # probe <status> [<node expression over the JSON body, b>] -- <curl args>
          probe() {
            want=$1; shift
            check=true
            if [ "$1" != "--" ]; then check=$1; shift; fi
            shift
            for i in 1 2 3 4 5 6; do
              got=$(curl -sS -o "$RUNNER_TEMP/probe.body" -w '%{http_code}' --max-time 20 "$@" || true)
              if [ "$got" = "$want" ] && B="$(cat "$RUNNER_TEMP/probe.body")" node -e "let b=null;try{b=JSON.parse(process.env.B)}catch{}process.exit(($check)?0:1)" 2>/dev/null; then
                echo "ok $want ($check): ${*: -1}"; return 0
              fi
              sleep $((i * 5))
            done
            echo "::error::expected $want with ($check), got $got $(head -c 300 "$RUNNER_TEMP/probe.body"): ${*: -1}"
            return 1
          }
          started=$(date +%s)
          echo "started=$started" >> "$GITHUB_OUTPUT"
          # ip_limit is what the per-address cap made of that very read: `counted` proves the live
          # version carries the binding and its health route calls it.
          # Where and how fast the key Worker's own D1 read was served: each key present, null allowed.
          probe 200 'b.d1==="ok"&&b.queue==="bound"&&b.polar==="configured"&&b.ip_limit==="counted"&&"d1_served_by_primary" in b&&"d1_served_by_region" in b&&"d1_ms" in b' -- https://license.claudinite.com/v1/key/health
          cp "$RUNNER_TEMP/probe.body" "$RUNNER_TEMP/key-health.json"
          probe 200 -- https://license.claudinite.com/v1/sync/health
          # The App's webhook on the sync Worker: an unsigned delivery refused, and its secret held.
          probe 401 -- -X POST -H 'content-type: application/json' -d '{}' https://license.claudinite.com/github-webhook
          probe 200 'b.github_webhook_secret===true' -- https://license.claudinite.com/v1/sync/health
          probe 200 'b.polar_webhook_secret===true' -- https://license.claudinite.com/v1/sync/health
          # The live Polar path: a sandbox checkout made with the code the key Worker bundles, whose
          # checkout.created delivery, signed with the endpoint's secret, the sync Worker must verify.
          # Polar sends it when the checkout is created, so the hosted page is never fetched. Nothing
          # is bought; the checkout expires on its own. It is for the fleet this repo's owner can buy.
          checkout_plan=organization
          if [ "$OWNER_TYPE" = User ]; then checkout_plan=personal; fi
          checkout=$(node tools/polar-checkout.mjs --plan "$checkout_plan" --owner-id "$GITHUB_REPOSITORY_OWNER_ID" --owner-login "$GITHUB_REPOSITORY_OWNER" --owner-type "$OWNER_TYPE")
          echo "sandbox checkout: $checkout"
          probe 200 "b.last_polar_webhook_at>=$started" -- https://license.claudinite.com/v1/sync/health
          # A real OIDC token from this run: deploy.yml is not a pinned workflow, so the verifier must
          # accept the token and the pin must refuse it.
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claudinite" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$oidc"
          probe 403 'b.refused==="workflow-not-pinned"' -- -X POST -H "Authorization: Bearer $oidc" -H 'content-type: application/json' -d '{"engine_version":"deploy-read-back"}' https://license.claudinite.com/v1/actions-key
          # That refusal counted one key point; the key counts read-back looks for it from this time.
          echo "point_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        name: Read back D1 read replication and where the key Worker's read was served
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_READ_REPLICATION: ${{ vars.D1_READ_REPLICATION }}
        run: |
          served=$(node -p 'const b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));`d1_served_by_primary=${b.d1_served_by_primary} d1_served_by_region=${b.d1_served_by_region} d1_ms=${b.d1_ms}`' "$RUNNER_TEMP/key-health.json")
          replication=$(node tools/ensure-d1.mjs --name claudinite-licenses --show-read-replication)
          mode=$(printf '%s\n' "$replication" | sed -n 's/^read replication: //p')
          # Only a deploy that owns the mode requires it; otherwise a failure here would roll back a
          # healthy release over a field the API reference makes optional.
          warning=""
          if [ "$D1_READ_REPLICATION" = auto ]; then
            [ "$mode" = auto ] || { echo "::error::claudinite-licenses reads ${mode:-nothing} while D1_READ_REPLICATION is auto"; exit 1; }
          else
            case "$mode" in
              auto|disabled) ;;
              *) warning="claudinite-licenses reports no read replication mode the deploy knows: ${mode:-nothing}; D1_READ_REPLICATION is ${D1_READ_REPLICATION:-unset}, continuing"
                 echo "::warning::$warning" ;;
            esac
          fi
          echo "read replication: ${mode:-nothing}; key health from this runner: $served"
          {
            echo "## D1 reads"
            echo
            echo "claudinite-licenses read replication: \`${mode:-nothing}\`. The key Worker's health read from this runner: $served."
            [ -z "$warning" ] || { echo; echo "Warning: $warning"; }
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.skip == 'false'
        name: Read back the key counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STARTED: ${{ steps.read-back.outputs.started }}
          POINT_AT: ${{ steps.read-back.outputs.point_at }}
        run: |
          # Observability only: it runs after promotion, where any failure rolls back a healthy
          # release, so every answer, a missing permission (#30), a missing dataset, a point not yet
          # queryable or the tool failing, is a warning and the step ends 0.
          err="$RUNNER_TEMP/key-counts.err"
          summary() { { echo "## Key counts"; echo; printf '%s\n' "$@"; } >> "$GITHUB_STEP_SUMMARY"; }
          failed() { msg="tools/key-counts.mjs $1 failed: $(tr '\n' ' ' < "$err" | cut -c1-300)"; echo "::warning::$msg"; }
          if ! probe=$(node tools/key-counts.mjs --probe 2> "$err"); then
            failed --probe
            summary "the counts could not be read: $msg"
            exit 0
          fi
          echo "$probe"
          case "$probe" in
            "key counts: unavailable"*)
              echo "::warning::$probe"
              summary "unavailable: the CLOUDFLARE_API_TOKEN lacks Account Analytics: Read; #30 is the owner's step."
              exit 0 ;;
            "key counts: available, dataset claudinite_key_counts absent")
              echo "::warning::$probe"
              summary "the dataset does not exist yet: no point has been written."
              exit 0 ;;
          esac
          # The read-back's actions-key refusal wrote one point: engine version deploy-read-back,
          # indexed by this repository's id, path actions, a little before point_at.
          since=$(( ${POINT_AT:-$STARTED} - 5 ))
          line=""
          for wait in 0 5 10 20 30 30; do
            [ "$wait" = 0 ] || sleep "$wait"
            if ! point=$(node tools/key-counts.mjs --since "$since" --repo-id "$GITHUB_REPOSITORY_ID" --engine-version deploy-read-back --group outcome,path --json 2> "$err"); then
              failed --since
              line="this run's point could not be read: $msg"
              break
            fi
            if P="$point" node -e 'const p=JSON.parse(process.env.P);process.exit(p.available&&p.rows.some((r)=>r.requests>=1)?0:1)'; then
              line="this run's point read back after $(( $(date +%s) - ${POINT_AT:-$STARTED} )) s"
              echo "key counts: $line"
              break
            fi
          done
          if [ -z "$line" ]; then
            line="this run's point was not queryable within 95 s"
            echo "::warning::key counts: $line"
          fi
          if ! week=$(node tools/key-counts.mjs --since 7d --group plan,outcome,path --markdown 2> "$err"); then
            failed "--since 7d"
            week="The week's counts could not be read: $msg"
          fi
          summary "$line." "" "### The last 7 days, by plan, outcome and path" "" "$week"
      - if: steps.gate.outputs.skip == 'false'
        name: Read back the alerts
        run: |
          # A fresh deploy can inherit a standing condition it did not cause and cannot clear, such as a
          # correction the previous reconcile already made, so a 503 is reported here, not failed.
          status=$(curl -sS -o "$RUNNER_TEMP/alerts.json" -w '%{http_code}' --max-time 20 https://license.claudinite.com/v1/sync/alerts || true)
          cat "$RUNNER_TEMP/alerts.json"; echo
          B="$(cat "$RUNNER_TEMP/alerts.json")" S="$status" node -e '
            let b = null;
            try { b = JSON.parse(process.env.B); } catch {}
            const s = process.env.S;
            if (!(s === "200" || s === "503") || !b || typeof b.ok !== "boolean" || !Array.isArray(b.alerts)) {
              console.log(`::error::/v1/sync/alerts answered ${s} without the alerts shape`);
              process.exit(1);
            }
            for (const a of b.alerts) console.log(`::warning::standing alert ${a.id}${a.detail ? `: ${a.detail}` : ""}`);
          '
          rm -f "$RUNNER_TEMP/alerts.json"
      - if: steps.gate.outputs.skip == 'false'
        name: Observe the per-address cap from outside
        run: |
          # The read-back's ip_limit field proves the cap is wired; this only reports what one address
          # meets. The limiter counts per Cloudflare location, on each machine, synced in the
          # background, so it is permissive and eventually consistent: a burst can pass it whole. The
          # 400 reads go eight a second across 50 seconds, past 300 inside the 60-second period, and
          # what they meet is a warning, never a rollback of a release the read-back judged healthy.
          dir="$RUNNER_TEMP/cap"
          rm -rf "$dir" && mkdir -p "$dir"
          started=$(date +%s)
          for round in $(seq 0 49); do
            [ "$round" -eq 0 ] || sleep 1
            seq $((round * 8 + 1)) $((round * 8 + 8)) | xargs -P 8 -I{} sh -c 'curl -sS -o /dev/null -D "$1/$2.headers" -w "%{http_code}" --max-time 20 https://license.claudinite.com/v1/key/health > "$1/$2.code" 2>/dev/null || true' _ "$dir" {}
          done
          elapsed=$(( $(date +%s) - started ))
          sent=$(find "$dir" -name '*.code' | wc -l)
          refused=$(grep -lx 429 "$dir"/*.code 2>/dev/null | wc -l)
          echo "sent $sent health reads in ${elapsed}s, $refused answered 429"
          if [ "$refused" -eq 0 ]; then
            echo "::warning::$sent health reads from one address in ${elapsed}s met no 429; the limiter is permissive by design, and the read-back's ip_limit says the cap is wired"
            exit 0
          fi
          version=""
          for code in $(grep -lx 429 "$dir"/*.code); do
            version=$(grep -i '^x-claudinite-version: ' "${code%.code}.headers" | cut -d' ' -f2 | tr -d '\r')
            [ -n "$version" ] && break
          done
          if [ -z "$version" ]; then
            echo "::warning::none of the $refused 429s carried a version header, so no Worker gave them"
            exit 0
          fi
          echo "ok 429 from version $version, $refused of $sent health reads refused in ${elapsed}s"
      - if: steps.gate.outputs.skip == 'false'
        name: Wait out the cap's period before the final probe
        # The cap's period is 60 seconds; the final probe then starts with a fresh budget.
        run: sleep 61
      - if: steps.gate.outputs.skip == 'false'
        name: Probe the live Workers from outside
        run: |
          # The scheduled probe's checks; its alerts check is the step above's to report, and only the
          # schedule files the standing issue.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claudinite" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$OIDC"
          export OIDC
          set +e
          node tools/probe.mjs --base https://license.claudinite.com --oidc-token-env OIDC --json "$RUNNER_TEMP/probe.json" --attempts 3
          set -e
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/probe.json", "utf8"));
            const failed = s.checks.filter((c) => !c.ok && c.name !== "sync-alerts");
            for (const c of failed) console.log(`::error::probe check ${c.name} failed: ${c.detail}`);
            process.exit(failed.length ? 1 : 0);
          '
      - if: failure() && steps.gate.outputs.skip == 'false'
        name: Roll back to the versions that were live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The push's previous head: the commit to compare routes and triggers with when the live
          # version carries no tag (the sync Worker's, deployed whole). Empty on a dispatch.
          BEFORE: ${{ github.event.before }}
        run: |
          # Every Worker this run staged and has not cleared goes back to the version it served before
          # the run: the split key Worker whenever the run fails after their uploads, the sync Worker
          # only when its own deploy or judge failed.
          #
          # triggers deploy ran after promotion, so a route or cron the failing commit changed would
          # outlive the versions it came with: for each Worker rolled back, the live version's commit
          # (its tag, else the push's base) is compared with HEAD, and its routes and crons re-applied
          # from a config written beside the real one, so relative paths resolve, when they differ.
          restore_triggers() {
            local w=$1 live=$2 config="workers/$1/wrangler.jsonc" base=""
            if node tools/stage.mjs tag --config "$config" --id "$live" --json "$RUNNER_TEMP/$w.tag.json" > /dev/null; then
              base=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).tag ?? ""' "$RUNNER_TEMP/$w.tag.json")
            fi
            [ -n "$base" ] || base=$BEFORE
            if [ -z "$base" ]; then
              echo "::warning::claudinite-$w: no commit to compare its routes and triggers with; check them by hand"
              return 0
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --quiet --unshallow origin || true; fi
            if ! git cat-file -e "$base:$config" 2>/dev/null; then
              echo "::warning::claudinite-$w: $base is no commit here, so its routes and triggers were not compared; check them by hand"
              return 0
            fi
            git show "$base:$config" > "$RUNNER_TEMP/$w.base.jsonc"
            if node -e '
              const fs = require("fs");
              const keys = (f) => { const c = JSON.parse(fs.readFileSync(f, "utf8").replace(/^\s*\/\/.*$/gm, "")); return JSON.stringify([c.routes ?? null, c.triggers ?? null]); };
              process.exit(keys(process.argv[1]) === keys(process.argv[2]) ? 0 : 1);
            ' "$config" "$RUNNER_TEMP/$w.base.jsonc"; then
              echo "claudinite-$w: no route or trigger moved between HEAD and ${base::7}"
              return 0
            fi
            cp "$RUNNER_TEMP/$w.base.jsonc" "workers/$w/wrangler.rollback.jsonc"
            local ok=0
            node tools/stage.mjs triggers --config "workers/$w/wrangler.rollback.jsonc" || ok=1
            rm -f "workers/$w/wrangler.rollback.jsonc"
            if [ $ok = 0 ]; then
              echo "::error::claudinite-$w's routes or triggers differ between $(git rev-parse --short=7 HEAD) and ${base::7}; re-applied ${base::7}'s"
            else
              echo "::error::claudinite-$w's routes or triggers differ between $(git rev-parse --short=7 HEAD) and ${base::7}, and re-applying ${base::7}'s failed; run node tools/stage.mjs triggers on that commit's config by hand"
            fi
            return $ok
          }
          status=0
          for w in key sync; do
            if [ ! -f "$RUNNER_TEMP/staged/$w" ]; then
              if [ "$w" = sync ] && [ -f "$RUNNER_TEMP/sync-judged" ]; then
                echo "claudinite-sync passed its own judge after its deploy, so this failure is no verdict on it: left as deployed"
              else
                echo "claudinite-$w: not staged by this run, so there is nothing to roll back"
              fi
              continue
            fi
            live=$(cat "$RUNNER_TEMP/staged/$w")
            if [ -z "$live" ]; then
              echo "::warning::claudinite-$w had no live version before this run, so there is nothing to roll it back to"
              continue
            fi
            if node tools/stage.mjs rollback --config "workers/$w/wrangler.jsonc" --id "$live"; then
              echo "::error::claudinite-$w rolled back to $live"
              restore_triggers "$w" "$live" || status=1
            else
              echo "::error::claudinite-$w could not be rolled back to $live; run node tools/stage.mjs rollback --config workers/$w/wrangler.jsonc --id $live by hand"
              status=1
            fi
          done
          exit $status
