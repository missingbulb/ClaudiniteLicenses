name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rotate_polar_webhook:
        description: Replace the Polar webhook endpoint, and with it the sync Worker's POLAR_WEBHOOK_SECRET
        type: boolean
        default: false
      rehearse_d1_restore:
        description: Rehearse the D1 Time Travel restore on a throwaway database the run creates and deletes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # id-token: the read-back asks GitHub for an OIDC token, so a real one proves the key Worker's verifier.
    permissions:
      contents: read
      id-token: write
    env:
      WRANGLER_SEND_METRICS: "false"
      # Each version's message, so `wrangler versions list` reads as a changelog of runs.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: gate
        name: Check deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAUDINITE_GITHUB_APP_ID: ${{ secrets.CLAUDINITE_GITHUB_APP_ID }}
          CLAUDINITE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLAUDINITE_GITHUB_APP_PRIVATE_KEY }}
          CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET }}
          ISSUING_KEY_PRIVATE: ${{ secrets.ISSUING_KEY_PRIVATE }}
          ISSUING_KEY_CERT: ${{ secrets.ISSUING_KEY_CERT }}
          KEY_ISSUING_KEY_PRIVATE: ${{ secrets.KEY_ISSUING_KEY_PRIVATE }}
          KEY_ISSUING_KEY_CERT: ${{ secrets.KEY_ISSUING_KEY_CERT }}
          POLAR_SANDBOX_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
        run: |
          for pair in "ISSUING_KEY_PRIVATE ISSUING_KEY_CERT" "KEY_ISSUING_KEY_PRIVATE KEY_ISSUING_KEY_CERT"; do
            set -- $pair
            a=$(printenv "$1" || true); b=$(printenv "$2" || true)
            if [ -n "$a$b" ] && { [ -z "$a" ] || [ -z "$b" ]; }; then
              echo "::error::only one of $1 and $2 is set: set both, or neither to deploy with the dev key in keys/dev"
              exit 1
            fi
          done
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLAUDINITE_GITHUB_APP_ID CLAUDINITE_GITHUB_APP_PRIVATE_KEY CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET POLAR_SANDBOX_TOKEN; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "deploy skipped: missing$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # Expected until every secret is set: a skipped deploy is not a failure.
            exit 0
          fi
          if [ -z "$ISSUING_KEY_PRIVATE$ISSUING_KEY_CERT" ]; then
            echo "::warning::ISSUING_KEY_PRIVATE and ISSUING_KEY_CERT are unset: claudinite-public-key signs with the dev license-public key in keys/dev, trusted by no released binary, until ClaudiniteEngine#5"
          fi
          if [ -z "$KEY_ISSUING_KEY_PRIVATE$KEY_ISSUING_KEY_CERT" ]; then
            echo "::warning::KEY_ISSUING_KEY_PRIVATE and KEY_ISSUING_KEY_CERT are unset: claudinite-key signs with the dev license key in keys/dev, trusted by no released binary, until ClaudiniteEngine#5"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip == 'false'
        run: npm ci
      - if: steps.gate.outputs.skip == 'false'
        name: Make the D1 database exist and write its id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ensure-d1.mjs --name claudinite-licenses --write
      - if: steps.gate.outputs.skip == 'false'
        name: Record the D1 restore point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 time-travel info claudinite-licenses --json -c db/wrangler.jsonc > "$RUNNER_TEMP/restore-point.json"
          bookmark=$(node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8");const b=JSON.parse(t.slice(t.indexOf("{"))).bookmark;if(typeof b!=="string"||!b)process.exit(1);process.stdout.write(b)' "$RUNNER_TEMP/restore-point.json")
          echo "D1 restore point before this run's migrations: $bookmark"
          {
            echo "## D1 restore point"
            echo
            echo "claudinite-licenses before this run's migrations is bookmark \`$bookmark\`. To return the database there, dispatch \`d1-restore\` with that bookmark: \`gh workflow run d1-restore.yml -f bookmark=$bookmark\`. The bookmark stays valid for 7 days on Workers Free, 30 on Workers Paid."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.skip == 'false'
        name: Apply the D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply claudinite-licenses --remote -c db/wrangler.jsonc
      - if: steps.gate.outputs.skip == 'false'
        name: Make the writes queue and its dead-letter queue exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ensure-queue.mjs --name claudinite-licenses-writes --dlq
      - if: steps.gate.outputs.skip == 'false' && inputs.rehearse_d1_restore
        name: Rehearse the D1 restore on a throwaway database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/d1-restore-rehearsal.mjs
      - if: steps.gate.outputs.skip == 'false'
        id: live
        name: Read the live versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The version each Worker serves now is what a failure rolls it back to. A split an
          # interrupted run left behind is rolled back by hand first; this run never stacks on one.
          for w in public-key key sync router; do
            node tools/stage.mjs status --config "workers/$w/wrangler.jsonc" --json "$RUNNER_TEMP/$w.status.json"
            live=$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).versions;if(v.length>1){console.error(v.map((x)=>x.id+"@"+x.percentage+"%").join(" "));process.exit(1)}process.stdout.write(v[0]?.id??"")' "$RUNNER_TEMP/$w.status.json") || {
              echo "::error::claudinite-$w has a split standing; roll it back by hand with node tools/stage.mjs rollback --config workers/$w/wrangler.jsonc --id <the version that should be live>, then rerun"
              exit 1
            }
            echo "claudinite-$w live: ${live:-none}"
            echo "${w//-/_}=$live" >> "$GITHUB_OUTPUT"
          done
      - if: steps.gate.outputs.skip == 'false'
        id: upload-public-key
        name: Upload claudinite-public-key with its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ secrets.CLAUDINITE_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLAUDINITE_GITHUB_APP_PRIVATE_KEY }}
          ISSUING_KEY_PRIVATE: ${{ secrets.ISSUING_KEY_PRIVATE }}
          ISSUING_KEY_CERT: ${{ secrets.ISSUING_KEY_CERT }}
        run: |
          # The secrets travel with the version, so none reaches the live code before its own does.
          trap 'rm -f "$RUNNER_TEMP/public-key.secrets.json"' EXIT
          umask 077
          node -e 'const e=process.env,dev=(f)=>require("fs").readFileSync("keys/dev/"+f,"utf8"),useDev=!e.ISSUING_KEY_PRIVATE;console.log(JSON.stringify({GITHUB_APP_ID:e.GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY:e.GITHUB_APP_PRIVATE_KEY,ISSUING_KEY_PRIVATE:useDev?dev("license-public.key"):e.ISSUING_KEY_PRIVATE,ISSUING_KEY_CERT:useDev?dev("license-public.cert.json"):e.ISSUING_KEY_CERT}))' > "$RUNNER_TEMP/public-key.secrets.json"
          node tools/stage.mjs upload --config workers/public-key/wrangler.jsonc --secrets-file "$RUNNER_TEMP/public-key.secrets.json" --tag "${GITHUB_SHA::7}" --message "$RUN_URL" --json "$RUNNER_TEMP/public-key.upload.json"
          echo "version_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version_id' "$RUNNER_TEMP/public-key.upload.json")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        id: upload-key
        name: Upload claudinite-key with its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ secrets.CLAUDINITE_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLAUDINITE_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.CLAUDINITE_GITHUB_APP_CLIENT_SECRET }}
          ISSUING_KEY_PRIVATE: ${{ secrets.KEY_ISSUING_KEY_PRIVATE }}
          ISSUING_KEY_CERT: ${{ secrets.KEY_ISSUING_KEY_CERT }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/key.secrets.json"' EXIT
          umask 077
          node -e 'const e=process.env,dev=(f)=>require("fs").readFileSync("keys/dev/"+f,"utf8"),useDev=!e.ISSUING_KEY_PRIVATE;console.log(JSON.stringify({GITHUB_APP_ID:e.GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY:e.GITHUB_APP_PRIVATE_KEY,...(e.GITHUB_APP_CLIENT_SECRET?{GITHUB_APP_CLIENT_SECRET:e.GITHUB_APP_CLIENT_SECRET}:{}),ISSUING_KEY_PRIVATE:useDev?dev("license.key"):e.ISSUING_KEY_PRIVATE,ISSUING_KEY_CERT:useDev?dev("license.cert.json"):e.ISSUING_KEY_CERT,POLAR_ACCESS_TOKEN:e.POLAR_ACCESS_TOKEN}))' > "$RUNNER_TEMP/key.secrets.json"
          # The roots an Actions key must chain to for an item grant.
          roots=$(node tools/keys.mjs trust-roots)
          node tools/stage.mjs upload --config workers/key/wrangler.jsonc --var "TRUST_ROOTS:$roots" --secrets-file "$RUNNER_TEMP/key.secrets.json" --tag "${GITHUB_SHA::7}" --message "$RUN_URL" --json "$RUNNER_TEMP/key.upload.json"
          echo "version_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version_id' "$RUNNER_TEMP/key.upload.json")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        name: Make the Polar webhook endpoint exist
        env:
          POLAR_API_BASE: https://sandbox-api.polar.sh
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
          ROTATE: ${{ inputs.rotate_polar_webhook }}
        run: |
          # Polar shows an endpoint's secret only when it makes the endpoint, so a Worker that lost or
          # never had the secret needs a new endpoint; otherwise the existing one is kept.
          rotate=""
          if [ "$ROTATE" = "true" ]; then
            rotate="--rotate"
          elif ! curl -sS --max-time 20 https://license.claudinite.com/v1/sync/health | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{let b={};try{b=JSON.parse(s)}catch{}process.exit(b.polar_webhook_secret===true?0:1)})'; then
            rotate="--rotate"
          fi
          node tools/ensure-polar-webhook.mjs --url https://license.claudinite.com/v1/sync/polar-webhook --secret-out "$RUNNER_TEMP/polar-webhook-secret" $rotate
      - if: steps.gate.outputs.skip == 'false'
        name: Secrets for claudinite-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ secrets.CLAUDINITE_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLAUDINITE_GITHUB_APP_PRIVATE_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
        run: |
          # A fresh admin token every run, kept only until the read-back has used it once.
          umask 077
          SYNC_ADMIN_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$SYNC_ADMIN_TOKEN"
          printf %s "$SYNC_ADMIN_TOKEN" > "$RUNNER_TEMP/sync-admin-token"
          # The webhook secret exists only when the step before made a new endpoint.
          SYNC_ADMIN_TOKEN=$SYNC_ADMIN_TOKEN node -e 'const e=process.env,fs=require("fs"),f=e.RUNNER_TEMP+"/polar-webhook-secret",hook=fs.existsSync(f)?{POLAR_WEBHOOK_SECRET:fs.readFileSync(f,"utf8")}:{};console.log(JSON.stringify({GITHUB_APP_ID:e.GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY:e.GITHUB_APP_PRIVATE_KEY,SYNC_ADMIN_TOKEN:e.SYNC_ADMIN_TOKEN,POLAR_ACCESS_TOKEN:e.POLAR_ACCESS_TOKEN,...hook}))' > "$RUNNER_TEMP/sync.secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/sync.secrets.json" -c workers/sync/wrangler.jsonc
          rm -f "$RUNNER_TEMP/sync.secrets.json" "$RUNNER_TEMP/polar-webhook-secret"
      - if: steps.gate.outputs.skip == 'false'
        name: Deploy claudinite-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ steps.live.outputs.sync }}
        run: |
          # The sync Worker deploys at once: which version a split hands its cron and queue consumer
          # is not documented, and it never touches key issuance. A failure rolls it back to LIVE.
          mkdir -p "$RUNNER_TEMP/staged"
          printf %s "$LIVE" > "$RUNNER_TEMP/staged/sync"
          npx wrangler deploy -c workers/sync/wrangler.jsonc
      - if: steps.gate.outputs.skip == 'false'
        name: Judge claudinite-sync by its own health and alerts
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(curl -sS -o "$RUNNER_TEMP/sync-health.json" -w '%{http_code}' --max-time 20 https://license.claudinite.com/v1/sync/health || true)
            [ "$status" = 200 ] && break
            sleep $((i * 5))
          done
          if [ "$status" != 200 ]; then
            echo "::error::claudinite-sync answered $status on /v1/sync/health after its deploy: $(head -c 300 "$RUNNER_TEMP/sync-health.json")"
            exit 1
          fi
          status=$(curl -sS -o "$RUNNER_TEMP/sync-alerts.json" -w '%{http_code}' --max-time 20 https://license.claudinite.com/v1/sync/alerts || true)
          B="$(cat "$RUNNER_TEMP/sync-alerts.json")" S="$status" node -e '
            let b = null;
            try { b = JSON.parse(process.env.B); } catch {}
            if (!(process.env.S === "200" || process.env.S === "503") || !b || !Array.isArray(b.alerts)) {
              console.log(`::error::claudinite-sync answered ${process.env.S} on /v1/sync/alerts without the alerts shape after its deploy`);
              process.exit(1);
            }
          '
      - if: steps.gate.outputs.skip == 'false'
        id: upload-router
        name: Upload claudinite-router with its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.CLAUDINITE_GITHUB_APP_WEBHOOK_SECRET }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/router.secrets.json"' EXIT
          umask 077
          node -e 'console.log(JSON.stringify({GITHUB_APP_WEBHOOK_SECRET:process.env.GITHUB_APP_WEBHOOK_SECRET}))' > "$RUNNER_TEMP/router.secrets.json"
          node tools/stage.mjs upload --config workers/router/wrangler.jsonc --secrets-file "$RUNNER_TEMP/router.secrets.json" --tag "${GITHUB_SHA::7}" --message "$RUN_URL" --json "$RUNNER_TEMP/router.upload.json"
          echo "version_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version_id' "$RUNNER_TEMP/router.upload.json")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip == 'false'
        id: split
        name: Serve the new versions to one tenth of requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_KEY_NEW: ${{ steps.upload-public-key.outputs.version_id }}
          KEY_NEW: ${{ steps.upload-key.outputs.version_id }}
          ROUTER_NEW: ${{ steps.upload-router.outputs.version_id }}
          PUBLIC_KEY_LIVE: ${{ steps.live.outputs.public_key }}
          KEY_LIVE: ${{ steps.live.outputs.key }}
          ROUTER_LIVE: ${{ steps.live.outputs.router }}
        run: |
          mkdir -p "$RUNNER_TEMP/staged"
          for w in public-key key router; do
            var=$(echo "$w" | tr a-z- A-Z_)
            new=$(printenv "${var}_NEW")
            # Written before the split, so a split that throws midway is still rolled back.
            live=$(printenv "${var}_LIVE" || true)
            printf %s "$live" > "$RUNNER_TEMP/staged/$w"
            node tools/stage.mjs split --config "workers/$w/wrangler.jsonc" --new "$new" --percent 10 --json "$RUNNER_TEMP/$w.split.json"
            echo "${w//-/_}_previous=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).previous ?? ""' "$RUNNER_TEMP/$w.split.json")" >> "$GITHUB_OUTPUT"
          done
      - if: steps.gate.outputs.skip == 'false'
        name: Make the route hostname resolve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/ensure-dns.mjs --zone claudinite.com --name license.claudinite.com
      - if: steps.gate.outputs.skip == 'false'
        id: canary
        name: Probe the new versions from outside
        env:
          PUBLIC_KEY_NEW: ${{ steps.upload-public-key.outputs.version_id }}
          KEY_NEW: ${{ steps.upload-key.outputs.version_id }}
          ROUTER_NEW: ${{ steps.upload-router.outputs.version_id }}
        run: |
          # Every check answered by a split Worker is judged on its new version's answer; the alerts
          # check is reported by the read-back, never gated on here.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claudinite" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$OIDC"
          export OIDC
          set +e
          node tools/probe.mjs --base https://license.claudinite.com --oidc-token-env OIDC --expect-version "public-key=$PUBLIC_KEY_NEW,key=$KEY_NEW,router=$ROUTER_NEW" --json "$RUNNER_TEMP/canary.json" --attempts 2
          set -e
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/canary.json", "utf8"));
            const failed = s.checks.filter((c) => !c.ok && c.name !== "sync-alerts");
            for (const c of failed) console.log(`::error::canary check ${c.name} failed on version ${c.version ?? "unknown"}: ${c.detail}`);
            process.exit(failed.length ? 1 : 0);
          '
      - if: steps.gate.outputs.skip == 'false' && steps.canary.outcome == 'success'
        name: Promote the new versions to all requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_KEY_NEW: ${{ steps.upload-public-key.outputs.version_id }}
          KEY_NEW: ${{ steps.upload-key.outputs.version_id }}
          ROUTER_NEW: ${{ steps.upload-router.outputs.version_id }}
        run: |
          for w in public-key key router; do
            var=$(echo "$w" | tr a-z- A-Z_)
            node tools/stage.mjs promote --config "workers/$w/wrangler.jsonc" --id "$(printenv "${var}_NEW")"
          done
          # A version upload applies bindings and vars but not routes or crons; this applies them.
          for w in public-key key sync router; do
            node tools/stage.mjs triggers --config "workers/$w/wrangler.jsonc"
          done
      - if: steps.gate.outputs.skip == 'false'
        name: Read back the live Workers
        env:
          POLAR_API_BASE: https://sandbox-api.polar.sh
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_SANDBOX_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          # probe <status> [<node expression over the JSON body, b>] -- <curl args>
          probe() {
            want=$1; shift
            check=true
            if [ "$1" != "--" ]; then check=$1; shift; fi
            shift
            for i in 1 2 3 4 5 6; do
              got=$(curl -sS -o "$RUNNER_TEMP/probe.body" -w '%{http_code}' --max-time 20 "$@" || true)
              if [ "$got" = "$want" ] && B="$(cat "$RUNNER_TEMP/probe.body")" node -e "let b=null;try{b=JSON.parse(process.env.B)}catch{}process.exit(($check)?0:1)" 2>/dev/null; then
                echo "ok $want ($check): ${*: -1}"; return 0
              fi
              sleep $((i * 5))
            done
            echo "::error::expected $want with ($check), got $got $(head -c 300 "$RUNNER_TEMP/probe.body"): ${*: -1}"
            return 1
          }
          started=$(date +%s)
          token=$(cat "$RUNNER_TEMP/sync-admin-token")
          rm "$RUNNER_TEMP/sync-admin-token"
          probe 200 -- https://license.claudinite.com/v1/public/health
          probe 200 'b.d1==="ok"&&b.queue==="bound"&&b.polar==="configured"' -- https://license.claudinite.com/v1/key/health
          probe 200 -- https://license.claudinite.com/v1/sync/health
          probe 200 'b.ok===true' -- -X POST -H "Authorization: Bearer $token" https://license.claudinite.com/v1/sync/reconcile
          # The App is installed on all of missingbulb, so the reconcile must have found repos.
          probe 200 "b.repos>0&&b.last_reconcile_at>=$started" -- https://license.claudinite.com/v1/sync/health
          probe 401 -- -X POST -H 'content-type: application/json' -d '{}' https://license.claudinite.com/github-webhook
          probe 200 'b.polar_webhook_secret===true' -- https://license.claudinite.com/v1/sync/health
          # A real listing of the sandbox's subscriptions, empty or not.
          probe 200 'b.ok===true' -- -X POST -H "Authorization: Bearer $token" https://license.claudinite.com/v1/sync/polar-reconcile
          probe 200 "b.last_polar_reconcile_at>=$started" -- https://license.claudinite.com/v1/sync/health
          # The live Polar path: a sandbox checkout made with the code the key Worker bundles, whose
          # checkout.created delivery, signed with the endpoint's secret, the sync Worker must verify.
          # Polar sends it when the checkout is created, so the hosted page is never fetched. Nothing
          # is bought; the checkout expires on its own.
          checkout=$(node tools/polar-checkout.mjs --plan private-repo --owner-id "$GITHUB_REPOSITORY_OWNER_ID" --owner-login "$GITHUB_REPOSITORY_OWNER" --owner-type "$OWNER_TYPE" --repo-id "$GITHUB_REPOSITORY_ID" --repo "$GITHUB_REPOSITORY")
          echo "sandbox checkout: $checkout"
          probe 200 "b.last_polar_webhook_at>=$started" -- https://license.claudinite.com/v1/sync/health
          # A real OIDC token from this run: deploy.yml is not a pinned workflow, so the verifier must
          # accept the token and the pin must refuse it.
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claudinite" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$oidc"
          probe 403 'b.refused==="workflow-not-pinned"' -- -X POST -H "Authorization: Bearer $oidc" -H 'content-type: application/json' -d '{"engine_version":"deploy-read-back"}' https://license.claudinite.com/v1/actions-key
      - if: steps.gate.outputs.skip == 'false'
        name: Read back the alerts
        run: |
          # A fresh deploy can inherit a standing condition it did not cause and cannot clear, such as a
          # correction the previous reconcile already made, so a 503 is reported here, not failed.
          status=$(curl -sS -o "$RUNNER_TEMP/alerts.json" -w '%{http_code}' --max-time 20 https://license.claudinite.com/v1/sync/alerts || true)
          cat "$RUNNER_TEMP/alerts.json"; echo
          B="$(cat "$RUNNER_TEMP/alerts.json")" S="$status" node -e '
            let b = null;
            try { b = JSON.parse(process.env.B); } catch {}
            const s = process.env.S;
            if (!(s === "200" || s === "503") || !b || typeof b.ok !== "boolean" || !Array.isArray(b.alerts)) {
              console.log(`::error::/v1/sync/alerts answered ${s} without the alerts shape`);
              process.exit(1);
            }
            for (const a of b.alerts) console.log(`::warning::standing alert ${a.id}${a.detail ? `: ${a.detail}` : ""}`);
          '
          rm -f "$RUNNER_TEMP/alerts.json"
      - if: steps.gate.outputs.skip == 'false'
        name: Probe the live Workers from outside
        run: |
          # The scheduled probe's checks; its alerts check is the step above's to report, and only the
          # schedule files the standing issue.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claudinite" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$OIDC"
          export OIDC
          set +e
          node tools/probe.mjs --base https://license.claudinite.com --oidc-token-env OIDC --json "$RUNNER_TEMP/probe.json" --attempts 3
          set -e
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/probe.json", "utf8"));
            const failed = s.checks.filter((c) => !c.ok && c.name !== "sync-alerts");
            for (const c of failed) console.log(`::error::probe check ${c.name} failed: ${c.detail}`);
            process.exit(failed.length ? 1 : 0);
          '
      - if: failure() && steps.gate.outputs.skip == 'false'
        name: Roll back to the versions that were live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Every Worker this run staged goes back to the version it served before the run, whether
          # the canary, the promotion, the read-back or an upload or split midway failed.
          status=0
          for w in public-key key sync router; do
            [ -f "$RUNNER_TEMP/staged/$w" ] || continue
            live=$(cat "$RUNNER_TEMP/staged/$w")
            if [ -z "$live" ]; then
              echo "::warning::claudinite-$w had no live version before this run, so there is nothing to roll it back to"
              continue
            fi
            if node tools/stage.mjs rollback --config "workers/$w/wrangler.jsonc" --id "$live"; then
              echo "::error::claudinite-$w rolled back to $live"
            else
              echo "::error::claudinite-$w could not be rolled back to $live; run node tools/stage.mjs rollback --config workers/$w/wrangler.jsonc --id $live by hand"
              status=1
            fi
          done
          exit $status
